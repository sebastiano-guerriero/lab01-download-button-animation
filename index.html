<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Component Tutorial Starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main class="flex items-center justify-center min-h-screen font-primary">
      <div data-name="frame" class="relative size-135 bg-[#FBFAF9] isolate overflow-hidden flex items-center justify-center">
        <ul class="flex items-center gap-12">
          <li>
            <button class="relative block size-8 rounded-[10px] bg-white shadow-sm ring-1 ring-black/6 inset-shadow-[0_-1px_0_black]/3">
              <figure data-icon-wrapper-1 class="absolute inset-0 flex items-center justify-center hidden">
                <svg  class="text-[#5B5852]" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                  <path d="M15.25,11.75v1.5c0,1.105-.895,2-2,2H4.75c-1.105,0-2-.895-2-2v-1.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="var(--nucleo-stroke-width, 1.5)"></path>
                  <polyline points="5.5 6.75 9 10.25 12.5 6.75" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="var(--nucleo-stroke-width, 1.5)" data-color="color-2"></polyline>
                  <line x1="9" y1="10.25" x2="9" y2="2.75" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="var(--nucleo-stroke-width, 1.5)" data-color="color-2"></line>
                </svg>
              </figure>

              <figure data-icon-wrapper-2 class="absolute inset-0 flex items-center justify-center">
                <svg data-icon-2 class="size-4.5 text-[#5B5852]" width="18" height="18" viewBox="0 0 18 18">
                  <circle data-circle-loader cx="9" cy="9" r="7.25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke-opacity="0.3"/>
                  <polyline data-check points="5.75 9.25 8 11.75 12.25 6.25" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                </svg>
              </figure>
            </button>
          </li>
        </ul>
        
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
